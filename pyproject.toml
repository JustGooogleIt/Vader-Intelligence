[project]
name = "vader-intelligence"
version = "0.1.0"
description = "Read-only, reproducible MLB prediction-market collection"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
]

[project.scripts]
vader = "vader_intelligence.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "build>=1.6.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
